name: Build Android APK

on:
  push:
    branches: 
      - "2.0.0-auth-feature"  # Название твоей ветки

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest  # Используется последняя версия Ubuntu

    steps:
      # 1. Шаг: Проверка исходного кода
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Шаг: Установить JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'  # Используется JDK Temurin

      # 3. Шаг: Сделать gradlew исполнимым
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 4. Шаг: Очистка проекта и синхронизация зависимостей
      - name: Clean and Refresh dependencies
        run: ./gradlew clean build --refresh-dependencies  # Очищаем старые файлы и пересобираем

      # 5. Шаг: Декодируем release keystore (если необходимо для подписания APK)
      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/key_one.keystore

      # 6. Шаг: Обновляем gradle.properties
      - name: Update gradle.properties
        run: |
          echo "android.r8.strictFullModeForKeepRules=false" > gradle.properties
          echo "RELEASE_STORE_FILE=key_one.keystore" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> gradle.properties

      # 7. Шаг: Сборка APK
      - name: Build Release APK
        run: ./gradlew assembleRelease  # Собираем релизный APK

      # 8. Шаг: Поиск APK файлов
      - name: Find APK files
        run: |
          echo "=== Поиск APK файлов ==="
          find app -name "*.apk" -type f | sort
          
          echo "=== Содержимое папки app/build/outputs ==="
          ls -la app/build/outputs/apk/ || echo "Папка не существует"
          
          echo "=== Проверка всех возможных путей ==="
          find app/build -name "*.apk" -type f || echo "APK не найдены"

      # 9. Шаг: Загрузка APK как артефакта
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/**/*.apk
          if-no-files-found: warn
