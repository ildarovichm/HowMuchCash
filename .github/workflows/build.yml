name: Build Android APK

on:
  push:
    branches: [ "1.0-alpha" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/key_one.keystore
        shell: bash

      - name: Fix and Update gradle.properties
        run: |
          # Создаем новый файл с правильным форматированием
          cat > gradle.properties << 'EOF'
# Android Gradle properties
android.r8.strictFullModeForKeepRules=false

# Signing configuration
RELEASE_STORE_FILE=key_one.keystore
RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
EOF

      - name: Clean and Build Release APK
        run: |
          ./gradlew clean
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk